name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: ''}
          - {goos: linux, goarch: arm64, ext: ''}
          - {goos: darwin, goarch: amd64, ext: ''}
          - {goos: darwin, goarch: arm64, ext: ''}
          - {goos: windows, goarch: amd64, ext: '.exe'}
          - {goos: windows, goarch: arm64, ext: '.exe'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "eavesong${EXT}" ./cmd/eavesong
          tar -czf "eavesong_${GOOS}_${GOARCH}.tar.gz" "eavesong${EXT}" README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: eavesong-${{ matrix.goos }}-${{ matrix.goarch }}
          path: eavesong_*.tar.gz
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eavesong-*
          merge-multiple: true
      - run: sha256sum eavesong_*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            eavesong_*.tar.gz
            SHA256SUMS
          generate_release_notes: true
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
