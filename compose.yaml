services:
  eavesong:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # put a TLS reverse proxy in front before exposing it
    env_file: .env              # copy .env.example to .env and fill it in
    volumes:
      - eavesong-data:/data
volumes:
  eavesong-data:
